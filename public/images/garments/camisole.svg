<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </linearGradient>
    <linearGradient id="silk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#221a38" opacity="0.4"/>

  <!-- SILK CAMISOLE TOP -->
  <!-- Ultra-thin spaghetti straps -->
  <path d="M 135 85 L 140 145" stroke="#fda4af" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 265 85 L 260 145" stroke="#fda4af" stroke-width="2.5" stroke-linecap="round"/>

  <!-- V-Neck Lace Trim Detail -->
  <path d="M 140 145 Q 200 180 260 145" stroke="#ffe4e6" stroke-width="3" stroke-dasharray="3,2" fill="none"/>

  <!-- Camisole Flowing Body -->
  <path d="M 140 145 Q 200 180 260 145 L 275 285 Q 200 295 125 285 Z" fill="url(#silk)" filter="url(#shadow)"/>

  <!-- Lace Hem Detail -->
  <path d="M 125 285 Q 200 295 275 285" stroke="#ffe4e6" stroke-width="3.5" stroke-dasharray="4,2" fill="none"/>
  
  <!-- Subtle silk sheen drape lines -->
  <path d="M 155 170 Q 185 220 180 285" stroke="#fecdd3" stroke-width="1.5" opacity="0.6" fill="none"/>
  <path d="M 245 170 Q 215 220 220 285" stroke="#fecdd3" stroke-width="1.5" opacity="0.6" fill="none"/>

  <!-- Label Badge -->
  <rect x="120" y="340" width="160" height="28" rx="14" fill="#1f1836" stroke="#f43f5e" stroke-width="1"/>
  <text x="200" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fda4af" text-anchor="middle">REAL CAMISOLE</text>
</svg>