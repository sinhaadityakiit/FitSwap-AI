<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </linearGradient>
    <linearGradient id="sportFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d87"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#221a38" opacity="0.4"/>

  <!-- Sports Bra Main Body Silhouette -->
  <!-- Wide Racerback Shoulder Straps -->
  <path d="M 110 110 L 140 180 Q 200 200 260 180 L 290 110 Q 250 135 200 135 Q 150 135 110 110 Z" fill="url(#sportFabric)" filter="url(#shadow)"/>

  <!-- Bust Compression Panel -->
  <path d="M 90 200 Q 80 230 110 260 L 290 260 Q 320 230 310 200 Q 260 180 200 195 Q 140 180 90 200 Z" fill="url(#sportFabric)" filter="url(#shadow)"/>

  <!-- Wide High-Elastic Underband -->
  <rect x="100" y="258" width="200" height="24" rx="4" fill="#18181b" stroke="url(#neonPink)" stroke-width="2"/>

  <!-- Ergonomic Aerodynamic Accent Lines -->
  <path d="M 125 125 Q 140 210 170 255" stroke="url(#neonPink)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 275 125 Q 260 210 230 255" stroke="url(#neonPink)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Breathable Mesh Inset Center Triangle -->
  <polygon points="190,165 210,165 200,185" fill="#3f3f46" stroke="url(#neonPink)" stroke-width="1"/>

  <!-- Label Badge -->
  <rect x="130" y="340" width="140" height="28" rx="14" fill="#1f1836" stroke="#ff2d87" stroke-width="1"/>
  <text x="200" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f472b6" text-anchor="middle">REAL SPORTS BRA</text>
</svg>
