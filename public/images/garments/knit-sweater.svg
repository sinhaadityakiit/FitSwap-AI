<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </linearGradient>
    <linearGradient id="knit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#221a38" opacity="0.4"/>

  <!-- COZY CABLE-KNIT SWEATER -->
  <!-- Left Chunky Sleeve -->
  <path d="M 140 115 L 75 140 L 55 240 L 95 248 L 125 180 Z" fill="#ea580c" filter="url(#shadow)"/>
  <!-- Right Chunky Sleeve -->
  <path d="M 260 115 L 325 140 L 345 240 L 305 248 L 275 180 Z" fill="#c2410c" filter="url(#shadow)"/>

  <!-- Sweater Torso Body -->
  <path d="M 140 115 L 125 180 L 125 295 L 275 295 L 275 180 L 260 115 Z" fill="url(#knit)" filter="url(#shadow)"/>

  <!-- Ribbed Turtleneck / Crew Collar -->
  <path d="M 155 115 Q 200 135 245 115 L 240 95 Q 200 85 160 95 Z" fill="#fb923c"/>
  <path d="M 160 95 Q 200 105 240 95" stroke="#ffedd5" stroke-width="2" stroke-dasharray="2,2"/>

  <!-- Cable Knit Braided Texture Patterns -->
  <path d="M 170 135 Q 165 170 175 210 Q 165 250 170 290" stroke="#ffedd5" stroke-width="2.5" fill="none" opacity="0.7"/>
  <path d="M 200 135 Q 205 170 195 210 Q 205 250 200 290" stroke="#ffedd5" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 230 135 Q 235 170 225 210 Q 235 250 230 290" stroke="#ffedd5" stroke-width="2.5" fill="none" opacity="0.7"/>

  <!-- Ribbed Waistband Hem -->
  <rect x="125" y="285" width="150" height="12" fill="#c2410c"/>
  <line x1="125" y1="285" x2="275" y2="285" stroke="#ffedd5" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- Label Badge -->
  <rect x="120" y="340" width="160" height="28" rx="14" fill="#1f1836" stroke="#f97316" stroke-width="1"/>
  <text x="200" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fed7aa" text-anchor="middle">REAL KNIT SWEATER</text>
</svg>