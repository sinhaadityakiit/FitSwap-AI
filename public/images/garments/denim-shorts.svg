<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </linearGradient>
    <linearGradient id="denim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#221a38" opacity="0.4"/>

  <!-- HIGH-WAIST DENIM SHORTS WITH FRAYED CUTOFFS -->
  <!-- Waistband with Belt Loops -->
  <path d="M 120 150 Q 200 160 280 150 L 285 180 Q 200 190 115 180 Z" fill="#1d4ed8" filter="url(#shadow)"/>
  <rect x="145" y="152" width="6" height="26" fill="#bfdbfe"/>
  <rect x="197" y="154" width="6" height="26" fill="#bfdbfe"/>
  <rect x="249" y="152" width="6" height="26" fill="#bfdbfe"/>
  <!-- Brass Fly Button -->
  <circle cx="200" cy="168" r="4.5" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>

  <!-- Shorts Body & Legs -->
  <path d="M 115 180 L 105 260 L 180 260 L 195 230 L 205 230 L 220 260 L 295 260 L 285 180 Q 200 190 115 180 Z" fill="url(#denim)" filter="url(#shadow)"/>

  <!-- Front Curved Scoop Pockets -->
  <path d="M 125 182 Q 160 190 150 220" stroke="#fcd34d" stroke-width="2" fill="none"/>
  <path d="M 275 182 Q 240 190 250 220" stroke="#fcd34d" stroke-width="2" fill="none"/>

  <!-- Distressed Frayed Cutoff Hem Details -->
  <path d="M 105 260 L 180 260" stroke="#bfdbfe" stroke-width="3" stroke-dasharray="3,2"/>
  <path d="M 220 260 L 295 260" stroke="#bfdbfe" stroke-width="3" stroke-dasharray="3,2"/>

  <!-- Label Badge -->
  <rect x="115" y="340" width="170" height="28" rx="14" fill="#1f1836" stroke="#3b82f6" stroke-width="1"/>
  <text x="200" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#bfdbfe" text-anchor="middle">REAL DENIM SHORTS</text>
</svg>