<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </linearGradient>
    <linearGradient id="silk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="50%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#221a38" opacity="0.4"/>

  <!-- SATIN PAJAMA 2-PIECE SET (NOTCH COLLAR SHIRT & TROUSERS) -->
  <!-- Pajama Top: Sleeves & Body -->
  <path d="M 150 95 L 95 120 L 80 190 L 115 195 L 130 150 L 130 225 L 270 225 L 270 150 L 285 195 L 320 190 L 305 120 L 250 95 Z" fill="url(#silk)" filter="url(#shadow)"/>

  <!-- Notch Lapel Collar with White Piping -->
  <path d="M 150 95 L 180 140 L 160 150 L 195 180 L 195 95 Z" fill="#c7d2fe"/>
  <path d="M 250 95 L 220 140 L 240 150 L 205 180 L 205 95 Z" fill="#818cf8"/>
  <path d="M 150 95 L 180 140 L 160 150" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <path d="M 250 95 L 220 140 L 240 150" stroke="#ffffff" stroke-width="1.5" fill="none"/>

  <!-- Buttons & Placket -->
  <circle cx="200" cy="150" r="3" fill="#ffffff"/>
  <circle cx="200" cy="175" r="3" fill="#ffffff"/>
  <circle cx="200" cy="200" r="3" fill="#ffffff"/>

  <!-- Pajama Pants (Elastic Waist & Fluid Legs) -->
  <path d="M 135 235 Q 200 240 265 235 L 280 325 L 220 325 L 205 260 L 195 260 L 180 325 L 120 325 Z" fill="url(#silk)" filter="url(#shadow)"/>
  
  <!-- Pant Hem White Piping -->
  <line x1="120" y1="322" x2="180" y2="322" stroke="#ffffff" stroke-width="2"/>
  <line x1="220" y1="322" x2="280" y2="322" stroke="#ffffff" stroke-width="2"/>

  <!-- Label Badge -->
  <rect x="120" y="340" width="160" height="28" rx="14" fill="#1f1836" stroke="#818cf8" stroke-width="1"/>
  <text x="200" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e0e7ff" text-anchor="middle">REAL PAJAMA SET</text>
</svg>