<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </linearGradient>
    <linearGradient id="linen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#221a38" opacity="0.4"/>

  <!-- BUTTON-DOWN FORMAL / LINEN SHIRT -->
  <!-- Left Sleeve, Body, Right Sleeve -->
  <path d="M 155 110 L 105 130 L 75 220 L 115 230 L 135 170 L 135 295 L 265 295 L 265 170 L 285 230 L 325 220 L 295 130 L 245 110 Z" fill="url(#linen)" filter="url(#shadow)"/>

  <!-- Left Collar Flap -->
  <path d="M 160 110 L 200 145 L 180 160 L 140 120 Z" fill="#38bdf8"/>
  <!-- Right Collar Flap -->
  <path d="M 240 110 L 200 145 L 220 160 L 260 120 Z" fill="#0284c7"/>

  <!-- Center Button Placket -->
  <rect x="195" y="145" width="10" height="150" fill="#0284c7"/>
  <!-- Mother-of-pearl Buttons -->
  <circle cx="200" cy="170" r="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
  <circle cx="200" cy="200" r="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
  <circle cx="200" cy="230" r="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
  <circle cx="200" cy="260" r="3" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>

  <!-- Chest Pocket -->
  <path d="M 150 175 L 175 175 L 175 205 L 162 215 L 150 205 Z" fill="none" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Label Badge -->
  <rect x="110" y="340" width="180" height="28" rx="14" fill="#1f1836" stroke="#38bdf8" stroke-width="1"/>
  <text x="200" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#bae6fd" text-anchor="middle">REAL BUTTON SHIRT</text>
</svg>