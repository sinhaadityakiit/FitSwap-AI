<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </linearGradient>
    <linearGradient id="khaki" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#221a38" opacity="0.4"/>

  <!-- CLASSIC DOUBLE-BREASTED TRENCH COAT -->
  <!-- Long Sleeves with Buckle Straps -->
  <path d="M 140 100 L 75 130 L 50 250 L 90 255 L 115 185 Z" fill="#b45309" filter="url(#shadow)"/>
  <path d="M 260 100 L 325 130 L 350 250 L 310 255 L 285 185 Z" fill="#92400e" filter="url(#shadow)"/>

  <!-- Longline Coat Body with Flared Hem -->
  <path d="M 140 100 L 115 185 L 105 320 L 295 320 L 285 185 L 260 100 Z" fill="url(#khaki)" filter="url(#shadow)"/>

  <!-- Storm Flap & Wide Notch Lapels -->
  <path d="M 140 100 L 175 150 L 150 165 L 195 210 L 195 100 Z" fill="#f59e0b"/>
  <path d="M 260 100 L 225 150 L 250 165 L 205 210 L 205 100 Z" fill="#d97706"/>

  <!-- Buckled Waist Belt with Grommets -->
  <rect x="110" y="210" width="180" height="18" rx="4" fill="#78350f" filter="url(#shadow)"/>
  <rect x="185" y="206" width="30" height="26" rx="4" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>

  <!-- Double-breasted Tortoiseshell Buttons -->
  <circle cx="170" cy="165" r="4" fill="#451a03"/>
  <circle cx="230" cy="165" r="4" fill="#451a03"/>
  <circle cx="170" cy="190" r="4" fill="#451a03"/>
  <circle cx="230" cy="190" r="4" fill="#451a03"/>

  <!-- Label Badge -->
  <rect x="120" y="340" width="160" height="28" rx="14" fill="#1f1836" stroke="#d97706" stroke-width="1"/>
  <text x="200" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fde68a" text-anchor="middle">REAL TRENCH COAT</text>
</svg>