<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#221a38" opacity="0.4"/>

  <!-- TAILORED SUIT BLAZER -->
  <!-- Left Shoulder & Sleeve -->
  <path d="M 145 105 L 85 135 L 65 240 L 105 245 L 125 180 Z" fill="#334155" filter="url(#shadow)"/>
  <!-- Right Shoulder & Sleeve -->
  <path d="M 255 105 L 315 135 L 335 240 L 295 245 L 275 180 Z" fill="#1e293b" filter="url(#shadow)"/>

  <!-- Structured Blazer Body -->
  <path d="M 145 105 L 125 180 L 125 295 L 275 295 L 275 180 L 255 105 Z" fill="url(#blazer)" filter="url(#shadow)"/>

  <!-- Sharp Peaked Lapels (Notch Lapels) -->
  <path d="M 145 105 L 175 160 L 155 175 L 195 225 L 195 105 Z" fill="#475569"/>
  <path d="M 255 105 L 225 160 L 245 175 L 205 225 L 205 105 Z" fill="#334155"/>

  <!-- Center Double-breasted / Single-button Closure -->
  <circle cx="200" cy="235" r="4" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>
  <circle cx="200" cy="265" r="4" fill="#facc15" stroke="#ca8a04" stroke-width="1"/>

  <!-- Flap Pockets -->
  <rect x="135" y="245" width="40" height="10" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <rect x="225" y="245" width="40" height="10" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1"/>

  <!-- Label Badge -->
  <rect x="120" y="340" width="160" height="28" rx="14" fill="#1f1836" stroke="#94a3b8" stroke-width="1"/>
  <text x="200" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0" text-anchor="middle">REAL TAILORED BLAZER</text>
</svg>