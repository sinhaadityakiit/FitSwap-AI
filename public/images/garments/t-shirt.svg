<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </linearGradient>
    <linearGradient id="cotton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#221a38" opacity="0.4"/>

  <!-- T-SHIRT SILHOUETTE -->
  <!-- Left Sleeve, Neckline, Right Sleeve, Body -->
  <path d="M 160 115 Q 200 135 240 115 L 295 140 L 325 200 L 285 220 L 265 175 L 265 295 L 135 295 L 135 175 L 115 220 L 75 200 L 105 140 Z" fill="url(#cotton)" filter="url(#shadow)"/>

  <!-- Crew Neck Ribbed Collar -->
  <path d="M 160 115 Q 200 145 240 115 Q 200 125 160 115 Z" fill="#94a3b8"/>

  <!-- Double Hem Stitching at Sleeves & Waist -->
  <path d="M 77 197 L 113 217" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 323 197 L 287 217" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 135 290 L 265 290" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Label Badge -->
  <rect x="120" y="340" width="160" height="28" rx="14" fill="#1f1836" stroke="#94a3b8" stroke-width="1"/>
  <text x="200" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">REAL T-SHIRT</text>
</svg>