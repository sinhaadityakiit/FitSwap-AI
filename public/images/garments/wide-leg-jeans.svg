<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </linearGradient>
    <linearGradient id="denim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#221a38" opacity="0.4"/>

  <!-- High-Waisted Wide-Leg Denim Jeans -->
  <!-- Waistband -->
  <path d="M 130 90 L 270 90 L 275 115 L 125 115 Z" fill="#1e3a8a" stroke="#ca8a04" stroke-width="2"/>
  <!-- Gold Rivet Button -->
  <circle cx="200" cy="102" r="4.5" fill="#ca8a04" stroke="#fef08a" stroke-width="1.5"/>

  <!-- Hips & Wide Legs -->
  <path d="M 125 115 L 275 115 L 290 170 L 305 315 L 225 315 L 205 180 L 195 180 L 175 315 L 95 315 L 110 170 Z" fill="url(#denim)" filter="url(#shadow)"/>

  <!-- Gold/Orange Contrast Stitching -->
  <path d="M 195 115 L 195 165 Q 200 175 205 165" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <!-- Pockets -->
  <path d="M 140 115 Q 165 145 140 160" stroke="#f59e0b" stroke-width="1.8" fill="none"/>
  <path d="M 260 115 Q 235 145 260 160" stroke="#f59e0b" stroke-width="1.8" fill="none"/>
  
  <!-- Outer leg side seams -->
  <path d="M 125 115 L 95 315" stroke="#172554" stroke-width="2"/>
  <path d="M 275 115 L 305 315" stroke="#172554" stroke-width="2"/>

  <!-- Label Badge -->
  <rect x="120" y="340" width="160" height="28" rx="14" fill="#1f1836" stroke="#2563eb" stroke-width="1"/>
  <text x="200" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#93c5fd" text-anchor="middle">REAL WIDE-LEG JEANS</text>
</svg>
