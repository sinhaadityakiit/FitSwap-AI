<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </linearGradient>
    <linearGradient id="ribbed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#221a38" opacity="0.4"/>

  <!-- FITTED CROP TOP SILHOUETTE -->
  <!-- Scoop Neckline & Tank Straps -->
  <path d="M 145 110 L 155 155 Q 200 175 245 155 L 255 110" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Cropped Hem Body -->
  <path d="M 145 155 Q 200 175 255 155 L 265 240 Q 200 248 135 240 Z" fill="url(#ribbed)" filter="url(#shadow)"/>

  <!-- Ribbed Texture Lines -->
  <path d="M 160 170 L 160 238" stroke="#fef3c7" stroke-width="1.5" opacity="0.6"/>
  <path d="M 180 175 L 180 240" stroke="#fef3c7" stroke-width="1.5" opacity="0.6"/>
  <path d="M 200 177 L 200 242" stroke="#fef3c7" stroke-width="1.5" opacity="0.6"/>
  <path d="M 220 175 L 220 240" stroke="#fef3c7" stroke-width="1.5" opacity="0.6"/>
  <path d="M 240 170 L 240 238" stroke="#fef3c7" stroke-width="1.5" opacity="0.6"/>

  <!-- Cropped Waistband Hem -->
  <path d="M 135 238 Q 200 248 265 238" stroke="#fde68a" stroke-width="3" fill="none"/>

  <!-- Label Badge -->
  <rect x="120" y="340" width="160" height="28" rx="14" fill="#1f1836" stroke="#f59e0b" stroke-width="1"/>
  <text x="200" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fef3c7" text-anchor="middle">REAL CROP TOP</text>
</svg>