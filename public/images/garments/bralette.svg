<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </linearGradient>
    <linearGradient id="lace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#221a38" opacity="0.4"/>

  <!-- DELICATE LACE BRALETTE -->
  <!-- Halter/Shoulder lace straps -->
  <path d="M 145 90 L 145 150" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 255 90 L 255 150" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>

  <!-- Left Triangle Soft Cup with Scalloped Edge -->
  <path d="M 145 150 L 95 235 Q 145 245 195 235 Z" fill="url(#lace)" filter="url(#shadow)"/>
  <path d="M 145 150 L 95 235" stroke="#fbcfe8" stroke-width="2.5" stroke-dasharray="2,3"/>
  <path d="M 145 150 L 195 235" stroke="#fbcfe8" stroke-width="2.5" stroke-dasharray="2,3"/>

  <!-- Right Triangle Soft Cup with Scalloped Edge -->
  <path d="M 255 150 L 205 235 Q 255 245 305 235 Z" fill="url(#lace)" filter="url(#shadow)"/>
  <path d="M 255 150 L 205 235" stroke="#fbcfe8" stroke-width="2.5" stroke-dasharray="2,3"/>
  <path d="M 255 150 L 305 235" stroke="#fbcfe8" stroke-width="2.5" stroke-dasharray="2,3"/>

  <!-- Wide Longline Lace Underband -->
  <path d="M 80 235 Q 200 248 320 235 L 320 265 Q 200 278 80 265 Z" fill="#be185d" filter="url(#shadow)"/>
  <path d="M 80 265 Q 200 278 320 265" stroke="#fbcfe8" stroke-width="3" stroke-dasharray="3,3" fill="none"/>

  <!-- Label Badge -->
  <rect x="120" y="340" width="160" height="28" rx="14" fill="#1f1836" stroke="#db2777" stroke-width="1"/>
  <text x="200" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fbcfe8" text-anchor="middle">REAL LACE BRALETTE</text>
</svg>