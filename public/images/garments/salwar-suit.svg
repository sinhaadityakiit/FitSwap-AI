<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </linearGradient>
    <linearGradient id="kurta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#221a38" opacity="0.4"/>

  <!-- ANARKALI / SALWAR SUIT KURTA WITH SIDE SLITS & CHURIDAR -->
  <!-- 3/4 Sleeves -->
  <path d="M 140 120 L 80 160 L 95 195 L 135 170 Z" fill="#0f766e" filter="url(#shadow)"/>
  <path d="M 260 120 L 320 160 L 305 195 L 265 170 Z" fill="#115e59" filter="url(#shadow)"/>

  <!-- Kurta Body with Flared A-Line Cut -->
  <path d="M 145 120 Q 200 145 255 120 L 290 285 L 250 285 L 235 210 L 165 210 L 150 285 L 110 285 Z" fill="url(#kurta)" filter="url(#shadow)"/>

  <!-- Churidar Bottom Gathers under Kurta -->
  <path d="M 175 285 L 170 325 L 190 325 L 195 285 Z" fill="#facc15"/>
  <path d="M 205 285 L 210 325 L 230 325 L 225 285 Z" fill="#facc15"/>

  <!-- Ornate Neckline Yoke & Gold Resham Work -->
  <path d="M 170 125 Q 200 170 230 125" stroke="#facc15" stroke-width="3" fill="none"/>
  <line x1="200" y1="150" x2="200" y2="195" stroke="#facc15" stroke-width="2.5"/>

  <!-- Flared Hem Gold Border -->
  <path d="M 110 283 L 150 283" stroke="#facc15" stroke-width="3"/>
  <path d="M 250 283 L 290 283" stroke="#facc15" stroke-width="3"/>

  <!-- Label Badge -->
  <rect x="120" y="340" width="160" height="28" rx="14" fill="#1f1836" stroke="#14b8a6" stroke-width="1"/>
  <text x="200" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#99f6e4" text-anchor="middle">REAL SALWAR SUIT</text>
</svg>