<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#221a38" opacity="0.4"/>

  <!-- SHAPING BODYSUIT SILHOUETTE -->
  <!-- Spaghetti Straps & V-Neckline -->
  <path d="M 140 80 L 148 135" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 260 80 L 252 135" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Bodysuit Core Profile -->
  <path d="M 148 135 Q 200 165 252 135 Q 275 170 265 220 Q 255 255 235 290 Q 200 305 165 290 Q 145 255 135 220 Q 125 170 148 135 Z" fill="url(#body)" filter="url(#shadow)"/>

  <!-- Ergonomic Shaping Rib Panels & Compression Seams -->
  <path d="M 165 170 Q 200 190 235 170" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <path d="M 155 200 Q 200 220 245 200" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M 160 235 Q 200 250 240 235" stroke="#94a3b8" stroke-width="2" fill="none"/>
  
  <!-- Vertical Tummy Control Panels -->
  <path d="M 180 185 L 180 270" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 220 185 L 220 270" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Bottom snap closure hint -->
  <rect x="185" y="285" width="30" height="8" rx="4" fill="#334155"/>

  <!-- Label Badge -->
  <rect x="120" y="340" width="160" height="28" rx="14" fill="#1f1836" stroke="#94a3b8" stroke-width="1"/>
  <text x="200" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0" text-anchor="middle">REAL BODYSUIT</text>
</svg>